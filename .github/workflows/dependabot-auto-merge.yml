name: Dependabot Auto Merge

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    name: Enable Auto Merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: |
          (
            steps.metadata.outputs.package-ecosystem == 'bun' &&
            contains(fromJSON('["version-update:semver-patch","version-update:semver-minor"]'), steps.metadata.outputs.update-type)
          ) || (
            steps.metadata.outputs.package-ecosystem == 'github-actions' &&
            steps.metadata.outputs.update-type != 'version-update:semver-major'
          )
        run: |
          # --auto merges immediately when the base branch has no required checks.
          # Fail closed when GitHub reports no merge gates (or they cannot be read).
          checks=$(gh pr checks "$PR_URL" --required --json name 2>/dev/null) || true
          if [[ -z "$checks" ]] || ! jq -e 'type == "array" and length > 0' <<< "$checks" >/dev/null; then
            echo "::warning::Auto-merge skipped: configure required status checks on the base branch first."
            exit 0
          fi
          gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
